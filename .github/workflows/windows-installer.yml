# Builds an unsigned Windows installer artifact for Rack Inventory Studio.
# Triggered manually or on pull requests to design/claude-ui-polish that touch
# relevant source paths.
#
# The produced installer is unsigned. Windows SmartScreen will show a warning
# on first run. Signing can be added later via GitHub Actions secrets.
#
# Artifacts are retained for 30 days and can be downloaded from the
# GitHub Actions run summary page.

name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - design/claude-ui-polish
    paths:
      - "apps/desktop/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows installer (unsigned)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @rack-inventory-studio/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @rack-inventory-studio/desktop test

      - name: Build Tauri Windows installer
        # tauri.conf.json beforeBuildCommand ("pnpm build") runs automatically.
        # No signing keys are configured — produces an unsigned installer.
        run: pnpm --filter @rack-inventory-studio/desktop tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: rack-inventory-studio-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
