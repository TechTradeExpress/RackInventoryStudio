name: Dependency Audit

# Runs:
# - weekly (Monday 06:00 UTC) — catches regressions without a triggering PR
# - manually via workflow_dispatch
# - on PRs that touch dependency files or this workflow
#
# rust-audit uses continue-on-error: true (advisory state unknown at authoring).
# frontend-audit is blocking — pnpm audit is clean as of vite v6 upgrade (PR M).

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.github/workflows/dependency-audit.yml'
      - '.github/actions/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate
