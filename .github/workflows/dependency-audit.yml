name: Dependency Audit

# Runs:
# - weekly (Monday 06:00 UTC) — catches regressions without a triggering PR
# - manually via workflow_dispatch
# - on PRs that touch dependency files or this workflow
#
# rust-audit uses continue-on-error: true (advisory state unknown at authoring).
# frontend-audit is blocking — pnpm audit is clean as of vite v6 upgrade (PR M).

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.github/workflows/dependency-audit.yml'

permissions:
  contents: read

jobs:
  rust-audit:
    name: Rust dependency audit
    runs-on: ubuntu-24.04
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  frontend-audit:
    name: Frontend dependency audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        run: pnpm audit --audit-level moderate
