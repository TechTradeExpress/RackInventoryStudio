# Builds an unsigned Windows diagnostic installer for QA and diagnostics verification.
# This workflow is separate from the standard Windows installer workflow.
# The artifact name includes "diagnostic" to distinguish it from production builds.
#
# Triggered manually only — go to Actions → Windows Diagnostic Installer → Run workflow.
#
# The installer is unsigned. Windows SmartScreen will show a warning on first run.
# See .ai/windows-diagnostic-installer.md for full QA instructions and log locations.

name: Windows Diagnostic Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-diagnostic:
    name: Windows diagnostic installer (unsigned, QA)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @rack-inventory-studio/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @rack-inventory-studio/desktop test

      - name: Build Tauri Windows installer
        # tauri.conf.json beforeBuildCommand ("pnpm build") runs automatically.
        # No signing keys configured — produces an unsigned NSIS installer.
        run: pnpm --filter @rack-inventory-studio/desktop tauri build

      - name: Prepare diagnostic artifact directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostic-artifact | Out-Null
          Copy-Item target\release\bundle\nsis\*.exe diagnostic-artifact\

          $branch = '${{ github.ref_name }}'
          $runNum = '${{ github.run_number }}'
          $runId  = '${{ github.run_id }}'
          $date   = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm UTC')

          $lines = @(
            "Rack Inventory Studio - Windows Diagnostic Installer",
            "=====================================================",
            "",
            "PURPOSE",
            "  This installer is for QA and diagnostics verification only.",
            "  It is NOT a production release. The binary is unsigned.",
            "",
            "BUILD INFO",
            "  Branch : $branch",
            "  Run    : $runNum  (run id: $runId)",
            "  Built  : $date",
            "",
            "SMARTSCREEN WARNING",
            "  This installer is not code-signed.",
            "  On first launch Windows Defender SmartScreen shows",
            "  'Windows protected your PC' -- click 'More info' then 'Run anyway'.",
            "",
            "LOG FILE LOCATION (Windows 11)",
            "  %APPDATA%\com.techtradeexpress.rackinventorystudio\logs\",
            "  Typical path:",
            "  C:\Users\<username>\AppData\Roaming\com.techtradeexpress.rackinventorystudio\logs\",
            "",
            "  To open the folder: Win+R -> type %APPDATA% -> press Enter",
            "  -> navigate to com.techtradeexpress.rackinventorystudio\logs\",
            "",
            "QA CHECKLIST",
            "  1. Install the app (accept SmartScreen warning).",
            "  2. Launch -- verify no error dialog on startup.",
            "  3. Open the example-repository (or create a new one).",
            "  4. Run: Validate repository, Save changes.",
            "  5. Try CSV Import: paste a sample CSV, click Preview.",
            "  6. Check the Repository tab: Git status, Safe Publish steps.",
            "  7. After each action, open the log file and verify entries appear.",
            "  8. Close the app -- verify no crash or Windows error dialog.",
            "",
            "EXPECTED LOG ENTRIES",
            "  INFO  Rack Inventory Studio starting",
            "  INFO  Rack Inventory Studio frontend initializing",
            "  INFO  open_repository: ok code=... locations=... racks=... devices=...",
            "  INFO  save_repository: ok created=... updated=... unchanged=...",
            "  INFO  validate_repository: ok errors=... warnings=... infos=...",
            "  INFO  csv_preview: ok rows=...",
            "  INFO  git_status: is_repo=true branch=... clean=...",
            "",
            "WHAT MUST NOT APPEAR IN LOGS",
            "  - Full file system paths (only basenames are logged)",
            "  - Passwords, tokens, private keys, secrets, API keys",
            "  - Raw YAML or CSV file contents",
            "  - Serial numbers, asset tag values, or full device records",
            "",
            "KNOWN LIMITATIONS",
            "  - Unsigned installer: SmartScreen warning on first run.",
            "  - Logs are local-only. No telemetry or external upload.",
            "  - Log filename is managed by Tauri; exact name confirmed on first QA run.",
            "",
            "FULL DOCUMENTATION",
            "  .ai/windows-diagnostic-installer.md in the repository."
          )
          $lines | Out-File -FilePath diagnostic-artifact\diagnostic-readme.txt -Encoding utf8

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: rack-inventory-studio-windows-diagnostic-installer
          path: diagnostic-artifact/
          if-no-files-found: error
          retention-days: 30
