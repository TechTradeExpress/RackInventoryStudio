name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check workspace
        run: cargo check --workspace

  version-check:
    name: Version consistency
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs

  scripts:
    name: Script and hygiene checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run script tests
        run: node --test scripts/*.test.mjs

      - name: Run repository hygiene checks
        run: node scripts/check-repo-hygiene.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @rack-inventory-studio/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @rack-inventory-studio/desktop test

      - name: Frontend build
        run: pnpm --filter @rack-inventory-studio/desktop build

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
