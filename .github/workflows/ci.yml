name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

# Force all JavaScript actions to run on the Node.js 24 runtime.
# Suppresses the "Node.js 20 Actions are deprecated" warning emitted by
# pnpm/action-setup@v4 and actions/setup-node@v4, whose action.yml still
# declares runs: using: node20.  GitHub documents this env var as the
# supported opt-in for the node20→node24 runtime migration.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libdbus-1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Check workspace
        run: cargo check --workspace

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm --filter @rack-inventory-studio/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @rack-inventory-studio/desktop test

      - name: Frontend build
        run: pnpm --filter @rack-inventory-studio/desktop build
