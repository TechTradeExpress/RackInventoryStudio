name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - development
      - "roadmap/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install system dependencies
        uses: ./.github/actions/install-linux-system-deps

      - name: Show Rust version
        run: rustc --version && cargo --version

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  version-check:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check version consistency
        run: node scripts/check-version-consistency.mjs

  scripts:
    name: Script and hygiene checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run script tests
        run: node --test scripts/*.test.mjs

      - name: Run repository hygiene checks
        run: node scripts/check-repo-hygiene.mjs

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: "24"

      - name: TypeScript check
        run: pnpm --filter @rack-inventory-studio/desktop typecheck

      - name: Frontend tests
        run: pnpm --filter @rack-inventory-studio/desktop test

      - name: Frontend build
        run: pnpm --filter @rack-inventory-studio/desktop build

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run actionlint
        uses: raven-actions/actionlint@v2
