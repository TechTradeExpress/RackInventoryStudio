  <!-- status dot — asset present -->
  <circle cx="168" cy="133" r="2.5" fill="#fefdfb"/>
  <rect x="76" y="146" width="104" height="14" rx="2" fill="#1c2026" opacity=".9"/>
  <rect x="76" y="166" width="104" height="14" rx="2" fill="#1c2026" opacity=".9"/>
  <rect x="76" y="186" width="104" height="14" rx="2" fill="#1c2026" opacity=".9"/>
