  <rect x="48" y="44" width="160" height="12" rx="2" fill="#1c2026"/>
  <rect x="48" y="200" width="160" height="12" rx="2" fill="#1c2026"/>
  <!-- U-slot equipment rows -->
  <rect x="76" y="66" width="104" height="14" rx="2" fill="#1c2026" opacity=".9"/>
  <rect x="76" y="86" width="104" height="14" rx="2" fill="#1c2026" opacity=".9"/>
  <rect x="76" y="106" width="104" height="14" rx="2" fill="#1c2026" opacity=".9"/>
  <!-- selected / tracked unit (accent row) -->
