[package]
name = "rack-inventory-studio-desktop"
version = "0.1.0-beta.2"
edition = "2021"

[features]
# Compiles an embedded W3C WebDriver HTTP server into the binary for WDIO
# performance experiments.  Must be explicit — not enabled in normal builds.
# Build command: cargo build --release --features wdio-embedded
# (or via Tauri CLI: tauri build --no-bundle -- --features wdio-embedded)
wdio-embedded = ["dep:tauri-plugin-wdio-webdriver"]

[lib]
name = "rack_inventory_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

# Optional: embedded WebDriver server for WDIO testing (feature wdio-embedded).
# Not included in production builds; zero impact when the feature is inactive.
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

ris-core = { path = "../../../crates/ris-core" }
ris-repository = { path = "../../../crates/ris-repository" }
ris-validation = { path = "../../../crates/ris-validation" }
ris-import = { path = "../../../crates/ris-import" }
ris-git = { path = "../../../crates/ris-git" }
ris-application = { path = "../../../crates/ris-application" }

[dev-dependencies]
tempfile = "3"
