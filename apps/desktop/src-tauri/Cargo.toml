[package]
name = "rack-inventory-studio-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "rack_inventory_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

ris-core = { path = "../../../crates/ris-core" }
ris-repository = { path = "../../../crates/ris-repository" }
ris-validation = { path = "../../../crates/ris-validation" }
ris-import = { path = "../../../crates/ris-import" }
ris-git = { path = "../../../crates/ris-git" }
ris-application = { path = "../../../crates/ris-application" }
