[package]
name = "ris-repository"
version = "0.1.0"
edition = "2021"
description = "YAML repository loader/writer and RepositoryIndex."

[dependencies]
ris-core = { path = "../ris-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

